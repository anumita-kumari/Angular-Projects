<form class="bookForm" [formGroup]="bookingForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="fullName">Full Name</label>
    <input
      type="text"
      name="fullName"
      id="fullName"
      class="form-control"
      formControlName="fullName"
    />
  </div>
  <div
    class="error"
    *ngIf="
      !bookingForm.get('fullName')?.valid &&
      !bookingForm.get('fullName')?.touched &&
      !bookingForm.get('fullName')?.dirty
    "
  >
    Valid name is required.
  </div>
  <div class="form-group">
    <label for="email">Email</label>
    <input
      type="email"
      name="email"
      id="email"
      class="form-control"
      formControlName="email"
    />
  </div>
  <div class="form-group">
    <label for="phone">Phone</label>
    <input
      type="number"
      name="phone"
      id="phone"
      class="form-control"
      formControlName="phone"
    />
  </div>
  <div class="form-group">
    <label for="noOfTickets">No of Tickets</label>
    <input
      type="number"
      name="noOfTickets"
      id="noOfTickets"
      class="form-control"
      formControlName="noOfTickets"
    />
  </div>
  <div class="form-group">
    <label for="notes">Notes</label>
    <input
      type="text"
      name="notes"
      id="notes"
      class="form-control"
      formControlName="notes"
    />
  </div>
  <!-- <div class="form-group">
    <label for="bookingDate">Booking Date</label>
    <input
      type="date"
      name="bookingDate"
      id="bookingDate"
      class="form-control"
      formControlName="bookingDate"
    />
  </div> -->
  <div class="form-group">
    <label for="terms">Terms</label>
    <input
      type="checkbox"
      name="terms"
      id="terms"
      class=""
      formControlName="terms"
    />
  </div>
  <button mat-raised-button color="primary" type="cancel" (click)="resetForm()">
    Cancel
  </button>
  <button
    mat-raised-button
    color="primary"
    type="submit"
    [disabled]="!bookingForm.valid"
  >
    Submit
  </button>
</form>
